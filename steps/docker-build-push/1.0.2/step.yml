    storage_uri: steps/docker-build-push/1.0.2/bin/docker-build-push-darwin-amd64
    hash: sha256-c6cafa121158efde726de8380d81257222f6ae90b0d7d7a92e815a5d62125901
  darwin-arm64:
    storage_uri: steps/docker-build-push/1.0.2/bin/docker-build-push-darwin-arm64
