inputs:
- opts:
    description: Enables Bitrise Build Cache for Xcode. When enabled, activates Xcelerate
      and starts the Xcelerate proxy in the background.
    is_required: true
    summary: Enables Bitrise Build Cache for Xcode using Xcelerate
    title: Enable Xcode cache
    value_options:
    - "true"
    - "false"
  xcode_cache_enabled: "true"
- gradle_cache_enabled: "true"
  opts:
    description: Enables Bitrise Build Cache for Gradle. When enabled, activates Gradle
      cache with analytics and remote cache plugins.
    is_required: true
    summary: Enables Bitrise Build Cache for Gradle
    title: Enable Gradle cache
    value_options:
    - "true"
    - "false"
- opts:
    is_required: true
    summary: Enable logging additional information for troubleshooting
    title: Verbose logging
    value_options:
    - "true"
    - "false"
  verbose: "false"
- disable_prefix_mapping: "false"
  opts:
    description: |-
      Disable injecting Clang prefix-mapping flags into xcodebuild for the Xcode build cache.

      Prefix mapping canonicalizes rotating source/DerivedData paths so the compilation cache keys stay stable across builds (e.g. when source is checked out into a per-build temp dir). Disable only if it causes issues.
    is_required: true
    summary: Disable injecting Clang prefix-mapping flags into the Xcode build cache
    title: Disable Clang prefix mapping
    value_options:
    - "true"
    - "false"
- no_swift_cache: "false"
  opts:
    description: |-
      Cache clang/Objective-C compilation only for the Xcode build cache, leaving Swift uncached.

      Swift compile caching requires Swift explicit modules, and React Native projects can fail to build under them — the build fails with `unable to resolve module dependency` (e.g. for `React_RCTAppDelegate`) even when the cache is fully warm. Enable this to keep caching the Objective-C/C++ side, which is the bulk of a React Native app's compile units, instead of turning the Xcode cache off entirely.
    is_required: true
    summary: Cache clang/Objective-C compilation only, leaving Swift uncached
    title: Cache clang/Objective-C only, leaving Swift uncached
    value_options:
    - "true"
    - "false"
- cache_skip_flags: "false"
  opts:
    description: |-
      Skip passing cache flags to xcodebuild except the COMPILATION_CACHE_REMOTE_SERVICE_PATH.

      Cache will have to be enabled manually in the Xcode project settings. More information can be found at the FAQ
      document: https://docs.bitrise.io/en/bitrise-build-cache/build-cache-for-xcode/xcode-compilation-cache-faq.html
    is_required: true
    summary: Skip passing cache flags to xcodebuild
    title: Skip passing cache flags to xcodebuild
    value_options:
    - "true"
    - "false"
