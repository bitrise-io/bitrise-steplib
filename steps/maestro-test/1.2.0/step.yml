is_skippable: false
inputs:
- flow_path: .maestro
  opts:
    description: Maestro flow files or folders containing flow files, one per line.
      If a folder has a `config.yaml`, Maestro uses it.
    is_required: true
    summary: Maestro flow files or folders containing flow files, one per line.
    title: Flow path
- app_path: ""
  opts:
    description: |-
      The .apk (Android) or simulator .app (iOS) to install before the flows run. The Step runs the flows on Android or iOS based on this file.

      If you build the app with the official Bitrise Steps, use their output: `$BITRISE_APK_PATH` after **Android Build**, or `$BITRISE_APP_DIR_PATH` after **Xcode Build for Simulator**.

      An Android App Bundle (.aab) cannot be installed on an emulator. Convert it with **Export Universal APK** before this Step and use its `$BITRISE_APK_PATH`.
    is_required: true
    summary: The .apk (Android) or simulator .app (iOS) to install before the flows
      run.
    title: App path
- include_tags: ""
  opts:
    is_required: false
    summary: Run only the flows that have at least one of these tags (comma or newline
      separated).
    title: Include tags
- exclude_tags: ""
  opts:
    is_required: false
    summary: Skip the flows that have any of these tags (comma or newline separated).
    title: Exclude tags
- opts:
    is_required: true
    summary: The name the results are shown under on the Test Reports page.
    title: Test name
  test_name: Maestro
- num_flaky_test_attempts: "0"
  opts:
    description: |-
      Specifies the number of times a failed flow should be reattempted. Only the failed flows run again, with the same tags and arguments.

      A flow that initially fails but succeeds on any reattempt is reported as flaky and does not fail the Step.
      The maximum number of reruns allowed is 10. (Default: 0, which implies no reruns.)

      Rerunning a flow needs Maestro 2.6.0 or newer. Failed flows do not run again when the workspace config orders the flows with `executionOrder`.
    is_required: true
    summary: Specifies the number of times a failed flow should be reattempted.
    title: Number of times a failed flow is reattempted
- maestro_version: 2.11.0
  opts:
    category: Debugging
    description: |-
      The Maestro CLI version to install. The default is the version this Step release was tested with.

      Change it only when you need a different version before a new Step release ships it. Untested versions can run your flows, but the Step's test output handling is only guaranteed for the tested version.

      Use the version number from a [Maestro release](https://github.com/mobile-dev-inc/maestro/releases) tag without the `cli-` prefix, `2.1.0` or newer.
    is_required: true
    summary: The Maestro CLI version to install. The default is the version this Step
      release was tested with.
    title: Maestro CLI version
- additional_args: ""
  opts:
    category: Debugging
    description: Extra arguments appended to the `maestro test` command, for example
      `--no-reinstall-driver`.
    is_required: false
    summary: Extra arguments appended to the `maestro test` command.
    title: Additional maestro test arguments
- opts:
    category: Debugging
    description: |-
      JSON list of tests added to quarantine on Bitrise.io, quarantined tests are excluded from test runs.

      Skipping a flow that the Step finds in a `flow_path` folder needs Maestro 2.9.0 or newer. Flow files listed in `flow_path` are skipped with any version.

      A flow found in a `flow_path` folder is skipped by its path inside that folder. If another `flow_path` folder has a file with the same path, that file is skipped too, and the Step logs a warning.

      The Step reports each flow with the class name `<platform>:<flow file>`, for example `android:.maestro/login.yaml`, instead of the flow's name or its `junitClassname`, so that quarantining a flow on one platform does not skip it on the other.
    is_required: false
    summary: JSON list of tests added to quarantine on Bitrise.io, quarantined tests
      are excluded from test runs.
    title: Quarantined tests
  quarantined_tests: $BITRISE_QUARANTINED_TESTS_JSON
- bitrise_test_result_dir: $BITRISE_TEST_RESULT_DIR
  opts:
    category: Debugging
    is_dont_change_value: true
    is_required: true
    summary: The per-step folder the Bitrise CLI creates for test results.
    title: Step's test result directory
outputs:
- MAESTRO_JUNIT_PATH: null
  opts:
    summary: Path to the JUnit report of the flows, with every run of a retried flow.
    title: JUnit report path
- MAESTRO_TEST_OUTPUT_ZIP_PATH: null
  opts:
    summary: Path to the zipped Maestro output in the deploy directory, one attempt-N
      folder per run with its screenshots, logs, recordings and JUnit report.
    title: Test output zip path
