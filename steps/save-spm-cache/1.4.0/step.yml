project_type_tags:
- cordova
- flutter
- ionic
- ios
- kotlin-multiplatform
- macos
- react-native
type_tags:
- utility
toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-save-spm-cache
deps:
  brew:
  - name: zstd
is_skippable: true
run_if: .IsCI
inputs:
- derived_data_path: ~/Library/Developer/Xcode/DerivedData/**
  opts:
    description: |-
      Path of the project's Derived Data folder. Supports glob patterns.

      Ignored when Build Cache for Xcode is active and this Input is left at its default: that
      feature relocates Derived Data, and the Step caches the relocated location instead
      (published as `BITRISE_XCODE_DERIVED_DATA_PATH`). Set this Input to something other than
      the default to cache that path regardless.
    is_required: false
    summary: Path of the project's Derived Data folder.
    title: Derived Data Path
- opts:
    description: |-
      Xcode Project (`.xcodeproj`) or Workspace (`.xcworkspace`) path.

      If this is a Swift package, this should be the path to the `Package.swift` file.
    is_required: false
    summary: Path of the Xcode Project (`.xcodeproj`), Workspace (`.xcworkspace`)
      or Swift package (`Package.swift`)
    title: Xcode Project path. Used to automatically find Derived Data path, only
      when `Derived Data Path` is empty (not provided).
  project_path: $BITRISE_PROJECT_PATH
- opts:
    is_required: true
    summary: Enable logging additional information for troubleshooting
    title: Verbose logging
    value_options:
    - "true"
    - "false"
  verbose: "false"
- compression_level: 3
  opts:
    is_required: false
    summary: Zstd compression level to control speed / archive size. Set to 1 for
      fastest option. Valid values are between 1 and 19. Defaults to 3.
    title: Compression level
