title: Device Cloud for Maestro
summary: Uses devicecloud.dev to execute Maestro mobile tests
description: Executes Maestro mobile tests on devicecloud.dev with configurable parameters
website: https://devicecloud.dev
source_code_url: https://github.com/devicecloud-dev/bitrise-integration
published_at: 2026-09-24T16:23:31.347018Z
source:
  git: https://github.com/devicecloud-dev/bitrise-integration.git
  commit: e1508b4cf38dba4825d5989e18144482d8067469
host_os_tags:
- osx-10.10
- ubuntu-16.04
project_type_tags:
- ios
- android
- react-native
- cordova
- ionic
- flutter
type_tags:
- test
toolkit:
  bash:
    entry_file: step.sh
deps:
  brew:
  - name: git
  - name: node
  apt_get:
  - name: git
  - name: node
is_always_run: false
is_skippable: false
run_if: ""
inputs:
- api_key: ""
  opts:
    is_expand: true
    is_required: true
    is_sensitive: true
    summary: devicecloud.dev API Key from your app settings
    title: Device Cloud API Key
- app_file: ""
  opts:
    is_expand: true
    is_required: false
    summary: Path to the build artifact to upload
    title: App File Path
- app_binary_id: ""
  opts:
    is_expand: true
    is_required: false
    summary: The app binary already uploaded to devicecloud.dev
    title: App Binary ID
- app_url: ""
  opts:
    is_expand: true
    is_required: false
    summary: Signed URL to an Expo iOS build (.tar.gz). The archive is downloaded
      and extracted automatically. Expo signed URLs expire after ~1 hour.
    title: Expo App URL
- android_device: ""
  opts:
    is_expand: true
    is_required: false
    summary: Android device to run your flow against
    title: Android Device
- ios_device: ""
  opts:
    is_expand: true
    is_required: false
    summary: iOS device to run your flow against
    title: iOS Device
- opts:
    is_expand: true
    is_required: false
    summary: Path to the workspace folder containing Maestro flows
    title: Workspace Folder
  workspace: ""
- env_list: ""
  opts:
    is_expand: true
    is_required: false
    summary: List of environment variables to pass to the test separated by newlines
      (e.g. MY_VAR=my_value <newline> MY_OTHER_VAR=other_value)
    title: Environment Variables
- metadata: ""
  opts:
    description: |
      Arbitrary `key=value` pairs to attach to the run, one per line.

      For a GitHub repository the step also attaches the build's GitHub
      context (see `include_github_context`). A key you set here wins over
      the derived value, e.g. `gh_repo=owner/repo` when this Bitrise app
      builds a mirror of a GitHub repository.
    is_expand: true
    is_required: false
    summary: 'Arbitrary key-value metadata to include with your test run, separated
      by newlines (format: key=value)'
    title: Metadata
- include_github_context: "true"
  opts:
    default_value: "true"
    description: |
      When the app's repository is on github.com, attaches the build's
      GitHub context to the run as metadata, read from Bitrise's env vars:

      - `gh_repo` from `GIT_REPOSITORY_URL`
      - `gh_sha` from `BITRISE_GIT_COMMIT` (else `GIT_CLONE_COMMIT_HASH`)
      - `gh_branch` from `BITRISE_GIT_BRANCH`
      - `gh_pr_number` and `gh_pr_url` from `BITRISE_PULL_REQUEST`

      For any repository it also attaches `gh_run_id`, from
      `BITRISEIO_PIPELINE_ID` (else `BITRISE_BUILD_SLUG`), so runs from the
      same pipeline build never cancel each other under `cancel_previous`.

      With the DeviceCloud GitHub App connected, `gh_repo` + `gh_sha` make
      DeviceCloud post a GitHub check for the run; `gh_repo` + the branch
      or PR are what `cancel_previous` matches runs on. Keys set in the
      `metadata` input win. Set to `false` to attach none of these.
    is_expand: true
    is_required: false
    summary: Attach this build's GitHub repo, commit, branch and PR as gh_* metadata,
      which GitHub checks and cancel_previous rely on. Set to false to opt out.
    title: Include GitHub Context
    value_options:
    - "true"
    - "false"
- async: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Run tests asynchronously (exit immediately without waiting for results)
    title: Async Execution
    value_options:
    - "true"
    - "false"
- cancel_previous: "false"
  opts:
    default_value: "false"
    description: |
      Cancels the still-queued tests of the previous run from the same CI
      context when this run is submitted. Tests already running are left to
      finish; cancelled tests are refunded at 75%.

      The context is matched on repository + branch (or PR) + `check_name`,
      taken from the GitHub context the step attaches (see
      `include_github_context`) or from `gh_repo` and `gh_branch` or
      `gh_pr_number` in `metadata`. Without a repository and a branch or
      PR nothing is cancelled. Runs from the same pipeline build never
      cancel each other. If one build runs this step more than once (iOS
      and Android, say), give each invocation its own `check_name`:
      otherwise one platform's new run cancels the other platform's
      previous run.

      The superseded run does not fail its build: its step passes, with
      `DEVICE_CLOUD_UPLOAD_STATUS` set to `SUPERSEDED`.
    is_expand: true
    is_required: false
    summary: Cancel the still-queued tests of the previous run from the same CI context
    title: Cancel Previous Run
    value_options:
    - "true"
    - "false"
- dry_run: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Simulate the run without actually triggering the upload/test, useful
      for debugging workflow issues
    title: Dry Run
    value_options:
    - "true"
    - "false"
- android_api_level: ""
  opts:
    is_expand: true
    is_required: false
    summary: Android API level to use for testing
    title: Android API Level
- android_no_snapshot: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: '[Android only] Force cold boot instead of using snapshot boot. Automatically
      enabled for API 34+ but can be used to force cold boot on older API levels.'
    title: Android No Snapshot
    value_options:
    - "true"
    - "false"
- ios_version: ""
  opts:
    is_expand: true
    is_required: false
    summary: iOS version to use for testing
    title: iOS Version
- include_tags: ""
  opts:
    is_expand: true
    is_required: false
    summary: Comma-separated list of tags to include in test execution
    title: Include Tags
- exclude_tags: ""
  opts:
    is_expand: true
    is_required: false
    summary: Comma-separated list of tags to exclude from test execution
    title: Exclude Tags
- exclude_flows: ""
  opts:
    is_expand: true
    is_required: false
    summary: Flows to exclude from test execution
    title: Exclude Flows
- google_play: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Whether to use Google Play services
    title: Google Play
    value_options:
    - "true"
    - "false"
- name: ""
  opts:
    is_expand: true
    is_required: false
    summary: Custom name for the test run
    title: Test Run Name
- check_name: ""
  opts:
    is_expand: true
    is_required: false
    summary: Names the GitHub check this run posts, e.g. "iOS" gives "DeviceCloud
      / iOS". Only applies when the run carries GitHub commit metadata (gh_sha/gh_repo,
      attached automatically for GitHub repositories, see include_github_context)
      and your org has the DeviceCloud GitHub App installed. Use it when a commit
      is tested more than once so each run gets a check that can be required separately
      in branch protection, and keep the value fixed for a given workflow.
    title: GitHub Check Name
- device_locale: ""
  opts:
    is_expand: true
    is_required: false
    summary: Locale to use on the device
    title: Device Locale
- download_artifacts: ""
  opts:
    is_expand: true
    is_required: false
    summary: Which artifacts to download (ALL or FAILED)
    title: Download Artifacts
- maestro_version: ""
  opts:
    is_expand: true
    is_required: false
    summary: Specific version of Maestro to use
    title: Maestro Version
- opts:
    is_expand: true
    is_required: false
    summary: '[Android only] Device orientation (0 = portrait, 90 = landscape)'
    title: Device Orientation
  orientation: ""
- opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: '[Android only] Display crosshairs for screen interactions during test
      execution'
    title: Show Crosshairs
    value_options:
    - "true"
    - "false"
  show_crosshairs: "false"
- maestro_chrome_onboarding: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: '[Android only] Force Maestro-based Chrome onboarding - note: this will
      slow your tests but can fix browser related crashes'
    title: Maestro Chrome Onboarding
    value_options:
    - "true"
    - "false"
- opts:
    is_expand: true
    is_required: false
    summary: Number of times to retry failed tests
    title: Retry Count
  retry: ""
- opts:
    is_expand: true
    is_required: false
    summary: '[experimental] The type of runner to use - note: anything other than
      default will incur premium pricing tiers'
    title: Runner Type
  runner_type: ""
- opts:
    is_expand: true
    is_required: false
    summary: '[Android only] Software renderer the emulator boots with (lavapipe or
      swiftshader). Leave empty to let DeviceCloud choose: lavapipe by default, swiftshader
      for apps shipping the Flutter engine.'
    title: Render Engine
  render_engine: ""
- opts:
    is_expand: true
    is_required: false
    summary: Generate and download test reports in the specified format (allure, junit,
      html, or html-detailed)
    title: Report Format
  report: ""
- junit_path: ""
  opts:
    is_expand: true
    is_required: false
    summary: 'Custom file path for downloaded JUnit report (requires report=junit,
      default: ./report.xml)'
    title: JUnit Report Path
- allure_path: ""
  opts:
    is_expand: true
    is_required: false
    summary: 'Custom file path for downloaded Allure report (requires report=allure,
      default: ./report.html)'
    title: Allure Report Path
- html_path: ""
  opts:
    is_expand: true
    is_required: false
    summary: 'Custom file path for downloaded HTML report (requires report=html, default:
      ./report.html)'
    title: HTML Report Path
- ignore_sha_check: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Ignore the SHA hash check and upload the binary regardless of whether
      it already exists (not recommended)
    title: Ignore SHA Check
    value_options:
    - "true"
    - "false"
- api_url: ""
  opts:
    is_expand: true
    is_required: false
    summary: Custom API URL for devicecloud.dev (optional)
    title: API URL
- debug: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Enable detailed debug logging for troubleshooting issues
    title: Debug Mode
    value_options:
    - "true"
    - "false"
- disable_animations: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Disable device animations during test execution. On Android, disables
      system animation scales. On iOS, enables Reduce Motion. Reduces CPU load and
      may improve test reliability.
    title: Disable Animations
    value_options:
    - "true"
    - "false"
- opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Suppress the progress table output from the DCD CLI.
    title: Quiet Mode
    value_options:
    - "true"
    - "false"
  quiet: "false"
- opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Use the beta version of the DCD CLI instead of the latest stable release.
    title: Use Beta CLI
    value_options:
    - "true"
    - "false"
  use_beta: "false"
- json: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: Print the CLI's results as JSON. The step still fails a failed run.
    title: JSON Output
    value_options:
    - "true"
    - "false"
- json_file: "false"
  opts:
    default_value: "false"
    is_expand: true
    is_required: false
    summary: 'Write the results as JSON to <upload_id>_dcd.json (or json_file_name).
      dcd exits 0 in this mode even when tests fail, so the step decides from the
      upload status: a failed run still fails the step.'
    title: JSON File Output
    value_options:
    - "true"
    - "false"
- json_file_name: ""
  opts:
    is_expand: true
    is_required: false
    summary: Custom name for the JSON file (can also include relative path). Requires
      json_file to be true.
    title: JSON File Name
- config: ""
  opts:
    is_expand: true
    is_required: false
    summary: Path to custom config.yaml file. If not provided, defaults to config.yaml
      in root flows folders.
    title: Config File
- artifacts_path: ""
  opts:
    is_expand: true
    is_required: false
    summary: 'Custom file path for downloaded artifacts (default: ./artifacts.zip)'
    title: Artifacts Path
outputs:
- DEVICE_CLOUD_CONSOLE_URL: null
  opts:
    summary: URL to view the test results in the Device Cloud console
    title: Device Cloud Console URL
- DEVICE_CLOUD_FLOW_RESULTS: null
  opts:
    summary: 'JSON array with one entry per flow: its name, status and, for a failed
      flow, failReason'
    title: Flow Results
- DEVICE_CLOUD_UPLOAD_STATUS: null
  opts:
    summary: 'Status of the test run: PASSED, FAILED, PENDING, QUEUED or RUNNING (an
      async run reports whatever it had reached at submission); SUPERSEDED when a
      newer run replaced it through cancel_previous; ERROR when the status could not
      be read'
    title: Test Run Status
- DEVICE_CLOUD_APP_BINARY_ID: null
  opts:
    summary: ID of the uploaded app binary in Device Cloud
    title: App Binary ID
