inputs:
- opts:
    is_expand: true
    is_required: true
    summary: Test name displayed in the Test Reports.
    title: The name of the test
    value_options: []
  test_name: null
- base_path: $BITRISE_SOURCE_DIR
  opts:
    description: |
      You can provide a path to a single file or a directory path and filter for files using the **Test result search pattern** input.

      This is the base path where the Step will look for your test results and their attachments. We recommend using a relative path to the results:

      `app/build/test-results/testDemoDebugUnitTest/`

      or

      `./app/build/test-results/testDemoDebugUnitTest/`

      If your tests save attachments, such as screenshots, outside this folder, set a folder that contains both, for example `app/build/`. Then make the **Test result search pattern** specific enough to match only the test results, for example `*/test-results/testDemoDebugUnitTest/TEST-*.xml`.
    is_expand: true
    is_required: true
    summary: Path where the Step should look for custom test result files
    title: Test result base path
    value_options: []
- opts:
    description: |
      This glob should match your test result files within the provided base path.
      If it matches more than one file and every match is an XML file, the Step exports all the JUnit XMLs among them into the same test report. XML files that aren't JUnit XMLs are skipped with a warning. So is a file with the same name as one that is already exported, such as the same test class from another Gradle task, so match the results of a single test task.
      If the matches include a folder or another kind of file, the Step will produce a warning displaying all matches, and export only the first one.
      The matched file should be in a supported format. If you set a specific file path in the **Test result base path** input, set this value to `*`.

      **Examples**:

      Matching all files within the base path: `*`

      Matching the JUnit XMLs of a Gradle test task, also when the base path is a wider folder, such as `app/build/`: `*/test-results/testDemoDebugUnitTest/TEST-*.xml`
    is_expand: true
    is_required: true
    summary: A glob pattern that matches the test results within the base path.
    title: Test result search pattern
    value_options: []
  search_pattern: null
- bitrise_test_result_dir: $BITRISE_TEST_RESULT_DIR
  opts:
    description: Root directory for all test results created by the Bitrise CLI
    is_required: true
    title: Step's test result directory
- opts:
    category: Debug
    description: Enable verbose logging?
    is_required: true
    title: Enable verbose logging?
    value_options:
    - "yes"
    - "no"
  verbose_log: "no"
