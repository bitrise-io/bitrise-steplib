inputs:
- opts:
    description: |
      Open finder, and navigate to the directory you designated for Derived Data output.
      Open the folder for your project, then the Build/Products folders inside it.
      You should see a folder Debug-iphoneos and PROJECT_NAME_iphoneos_DEVELOPMENT_TARGET-arm64.xctestrun. Select them both, then right-click on one of them and select Compress 2 items.
    is_required: true
    summary: |
      The path to the zip file which contains the folder Debug-iphoneos and PROJECT_NAME_iphoneos_DEVELOPMENT_TARGET-arm64.xctestrun.
    title: Zip path
  zip_path: $BITRISE_TEST_BUNDLE_ZIP_PATH
- opts:
    description: |
      One device configuration per line, each in the `deviceID,version,language,orientation` format. See table below for the available devices.

      For example:
      ```
      iphonese3,26.3,en,portrait
      iphone8,16.6,en,landscape
      ```

      Available devices, OS versions and their capacity (generated on 2026-07-27):
      ```
      ┌─────────────┬────────────────────────┬───────────────┬─────────────────┬─────────┐
      │   MODEL_ID  │       MODEL_NAME       │ OS_VERSION_ID │ DEVICE_CAPACITY │   TAGS  │
      ├─────────────┼────────────────────────┼───────────────┼─────────────────┼─────────┤
      │ ipad10      │ iPad (10th generation) │ 16.6          │ Medium          │         │
      │ iphone11pro │ iPhone 11 Pro          │ 16.6          │ Medium          │         │
      │ iphone14pro │ iPhone 14 Pro          │ 16.6          │ Medium          │ default │
      │ iphone16pro │ iPhone 16 Pro          │ 18.3          │ Medium          │         │
      │ iphone8     │ iPhone 8               │ 16.6          │ Medium          │         │
      │ iphonese3   │ iPhone SE 3            │ 18.4          │ Medium          │         │
      │ iphonese3   │ iPhone SE 3            │ 26.3          │ Medium          │         │
      └─────────────┴────────────────────────┴───────────────┴─────────────────┴─────────┘
      ```

      For the authoritative list, see [Available devices in Test Lab](https://firebase.google.com/docs/test-lab/ios/available-testing-devices).
    is_required: true
    summary: One device configuration per line, each in the `deviceID,version,language,orientation`
      format. See table below for the available devices.
    title: Test devices
  test_devices: iphone16pro,18.3,en,portrait
- num_flaky_test_attempts: "0"
  opts:
    description: |-
      Specifies the number of times a test execution should be reattempted if one or more of its test cases fail for any reason.

      An execution that initially fails but succeeds on any reattempt is reported as FLAKY.
      The maximum number of reruns allowed is 10. (Default: 0, which implies no reruns.)
    is_required: true
    summary: Specifies the number of times a test execution should be reattempted
      if one or more of its test cases fail for any reason.
    title: Number of times a test execution is reattempted
- opts:
    category: Debug
    description: |
      Max time a test execution is allowed to run before it is automatically canceled. The default value is 900 (15 min).  Duration in seconds with up to nine fractional digits. Example: "3.5".
    summary: |
      Max time a test execution is allowed to run before it is automatically canceled. The default value is 900 (15 min).  Duration in seconds with up to nine fractional digits. Example: "3.5".
    title: Test timeout
  test_timeout: 900
- download_test_results: "false"
  opts:
    category: Debug
    description: |
      If this input is set to `true` all files generated in the test run will be downloaded. Otherwise, no any file will be downloaded.
    is_required: true
    summary: |
      If this input is set to `true` all files generated in the test run will be downloaded. Otherwise, no any file will be downloaded.
    title: Download files
    value_options:
    - "false"
    - "true"
- api_base_url: https://vdt.bitrise.io/test
  opts:
    category: Debug
    description: |
      The URL where test API is accessible.
    is_dont_change_value: true
    is_required: true
    summary: The URL where test API is accessible.
    title: Test API's base URL
- api_token: $ADDON_VDTESTING_API_TOKEN
  opts:
    category: Debug
    description: |
      The token required to authenticate with the API.
    is_dont_change_value: true
    is_required: true
    is_sensitive: true
    summary: The token required to authenticate with the API.
    title: API Token
- opts:
    category: Debug
    summary: JSON list of tests added to quarantine on Bitrise.io, quarantined tests
      are excluded from test runs.
    title: Quarantined tests
  quarantined_tests: $BITRISE_QUARANTINED_TESTS_JSON
outputs:
- VDTESTING_DOWNLOADED_FILES_DIR: null
  opts:
    description: The directory containing the downloaded files if you have set `download_test_results`
      inputs above.
    summary: The directory containing the downloaded files if you have set `download_test_results`
      inputs above.
    title: Downloaded files directory
- BITRISE_FLAKY_TEST_CASES: null
  opts:
    description: |-
      A list of flaky test cases. A test case is considered flaky if it has failed at least once, but passed at least once as well.

      The list contains the test cases in the following format:
      ```
      - TestSuit_1.TestClass_1.TestName_1
      - TestSuit_1.TestClass_1.TestName_2
      - TestSuit_1.TestClass_2.TestName_1
      - TestSuit_2.TestClass_1.TestName_1
      ...
      ```

      To export `BITRISE_FLAKY_TEST_CASES` Step Output `download_test_results` Step Input should be set to `true`.
    summary: A list of flaky test cases. A test case is considered flaky if it has
      failed at least once, but passed at least once as well.
    title: List of flaky test cases
